# Keeps the free Supabase project from pausing during school holidays.
# Runs Monday, Wednesday and Friday (and can be started by hand from the Actions tab).
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ping Supabase
        run: node scripts/keep-supabase-awake.mjs
